  <div class="grid2" style="margin-top:18px">
   <section class="panel"><h2 style="font-size:22px">Revision questions</h2><div class="tbl"><table><tbody><tr><td>True/False</td><td>${cnt('tf')}</td></tr><tr><td>Multiple choice</td><td>${cnt('mcq')}</td></tr><tr><td>Scientific terms</td><td>${cnt('term')}</td></tr><tr><td>Case sub-questions (5 cases)</td><td>${cnt('case')}</td></tr><tr><td><b>Total — all in the mock exam and solved</b></td><td><b>${REV.length}</b></td></tr><tr><td>Automatically gradable in the exam</td><td>${REV.filter(isObjective).length}</td></tr></tbody></table></div></section>
   <section class="panel"><h2 style="font-size:22px">Platform content</h2><div class="tbl"><table><tbody><tr><td>Lecture sections</td><td>${SECS.length}</td></tr><tr><td>Practice-bank items (lecture question sets)</td><td>${AD.PRACTICE.length}</td></tr><tr><td>Formulas / rules</td><td>${AD.FORMULAS.length} / ${AD.RULES.length}</td></tr><tr><td>Concepts / comparison tables</td><td>${AD.CONCEPTS.length} / ${AD.CONFUSED.length}</td></tr><tr><td>Flashcards</td><td>${FLASH.length}</td></tr><tr><td>Glossary terms</td><td>${AD.CONCEPTS.length + AD.GLOSS.length}</td></tr><tr><td>Supplementary lab scenarios</td><td>${AD.LAB.length}</td></tr></tbody></table></div></section>
  </div>
  <section class="panel" style="margin-top:18px"><h2 style="font-size:22px">Practice sets</h2><div class="tbl"><table><thead><tr><th>Set</th><th>Items</th><th>Answer key</th></tr></thead><tbody>${AD.PSETS.map(s => `<tr><td><a href="#practice/${s.lec}">${esc(s.title)}</a></td><td>${pc[s.id]}</td><td>${s.key==='given'?'In the source file':'Solved from the lecture content'}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="panel" style="margin-top:18px"><h2 style="font-size:22px">Items requiring manual verification (${AD.COVERAGE.flags.length})</h2><ol class="steps">${AD.COVERAGE.flags.map(f => `<li>${esc(f)}</li>`).join('')}</ol></section></div>`;
}

/* ---------- SEARCH ---------- */
let INDEX = null;
function buildIndex(){
  INDEX = [];
  SECS.forEach(s => INDEX.push({k:'Lecture', t:LEC[s.lec].short+': '+s.title, x:strip(s.html), r:'lecture/'+s.lec+'/'+s.id}));
  REV.forEach(r => INDEX.push({k:'Revision', t:qLabel(r), x:strip(r.q+' '+(r.opts||[]).map(o=>o[1]).join(' ')+' '+(r.ans||'')+' '+(r.expl||'')+' '+(r.corr||'')), r:'revision/'+r.id}));
  AD.PRACTICE.forEach(p => INDEX.push({k:'Practice', t:AD.PSETS.find(s=>s.id===p.set).title+' Q'+p.n, x:strip(p.q+' '+(p.ans||'')+' '+(p.why||'')+' '+(p.o||[]).map(o=>o[1]).join(' ')), r:'practice/'+p.lec}));
  AD.CONCEPTS.forEach(c => INDEX.push({k:'Concept', t:c.name, x:c.def+' '+c.simple+' '+c.kw.join(' '), r:'concepts/'+c.id}));
  AD.FORMULAS.forEach(f => INDEX.push({k:'Formula', t:f.title+' — '+f.eq, x:strip(f.when+' '+f.ex), r:'formulas/'+f.id}));
  AD.RULES.forEach(f => INDEX.push({k:'Rule', t:f.title, x:strip(f.text), r:'formulas/'+f.id}));
  AD.GLOSS.forEach(g => INDEX.push({k:'Glossary', t:g[0], x:g[1], r:g[2]}));
}
function hl(text, q){ const i = text.toLowerCase().indexOf(q); if (i < 0) return esc(text.slice(0,160)) + (text.length>160?'…':''); const s = Math.max(0, i-70); const part = text.slice(s, i+q.length+90); const j = part.toLowerCase().indexOf(q); return (s>0?'…':'') + esc(part.slice(0,j)) + '<mark>' + esc(part.slice(j,j+q.length)) + '</mark>' + esc(part.slice(j+q.length)) + '…'; }
function pageSearch(q){
  q = (q||'').trim(); if (!INDEX) buildIndex();
  const ql = q.toLowerCase(); const terms = ql.split(/\s+/).filter(Boolean);
  const res = !q ? [] : INDEX.map(it => { const hay = (it.t+' '+it.x).toLowerCase(); if (!terms.every(t => hay.includes(t))) return null; const sc = (it.t.toLowerCase().includes(ql)?10:0) + (hay.includes(ql)?3:0); return [sc, it]; }).filter(Boolean).sort((a,b) => b[0]-a[0]).map(x => x[1]);
  const box = $('#q'); if (box && box.value !== q) box.value = q;
  return `<div class="wrap"><header class="page-h"><h1 tabindex="-1">Search</h1><p class="lead">${q ? `${res.length} result${res.length===1?'':'s'} for “${esc(q)}”` : 'Type in the search box above and press Enter.'}</p></header>
  ${res.slice(0,80).map(it => `<a class="qcard" href="#${esc(it.r)}" style="display:block;text-decoration:none;color:var(--g)"><div class="qhead"><span class="badge o">${it.k}</span><b style="color:var(--w)">${esc(it.t)}</b></div><div style="font-size:14px">${hl(it.x, terms[0]||ql)}</div></a>`).join('') || (q ? '<p class="empty">No match. Try a shorter term such as “detection”, “review” or “engagement letter”.</p>' : '')}</div>`;
}

/* =============================== ROUTER =============================== */
const ROUTES = { home:pageHome, lectures:pageLectures, lecture:pageLecture, revision:pageRevision, practice:pageParam, formulas:pageFormulas, concepts:pageConcepts, exam:pageExam, map:pageMap, lab:pageLab, flashcards:pageFlash, weak:pageWeak, glossary:pageGlossary, coverage:pageCoverage, search:pageSearch };
let curRoute = '';
function route(){
  let h = location.hash.slice(1); try { h = decodeURIComponent(h); } catch(e){}
  if (!h) h = 'home';
  const parts = h.split('/'); const p = ROUTES[parts[0]] ? parts[0] : 'home';
  const fn = ROUTES[p];
  if (p === 'search') parts[1] = parts.slice(1).join('/');
  const main = $('#main');
  main.innerHTML = fn(parts[1], parts[2]);
  $$('#nav a').forEach(a => { if (a.dataset.r === p || (p === 'lecture' && a.dataset.r === 'lectures')) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.body.classList.remove('nav-open');
  if (p !== 'exam' || !examRunning()) document.body.classList.remove('distraction');
  const anchor = p === 'lecture' ? parts[2] : (['revision','formulas','concepts'].includes(p) ? parts[1] : null);
  const samePage = curRoute.split('/').slice(0,2).join('/') === h.split('/').slice(0,2).join('/');
  curRoute = h;
  if (anchor && document.getElementById(anchor)){ const el = document.getElementById(anchor); setTimeout(() => { el.scrollIntoView({block:'start', behavior:'instant'}); }, 0); }
  else if (!samePage || p === 'exam') { window.scrollTo({top:0, left:0, behavior:'instant'}); const t = main.querySelector('h1[tabindex]'); if (t && p !== 'exam') t.focus({preventScroll:true}); }
  if (p === 'exam' && examRunning()){ const t = $('#xqh'); if (t) t.focus({preventScroll:true}); }
  if (['lecture','revision','practice','formulas','concepts','map','lab','flashcards','glossary'].includes(p)){ st.last = h; save('last'); }
  document.title = (p === 'home' ? 'AUDIT — Study & Exam Platform' : routeName(h) + ' — AUDIT');
  updateSide();
}

/* =============================== EVENTS =============================== */
const ACT = {
  nav(){ document.body.classList.toggle('nav-open'); },
  done(b){ const id = b.dataset.id; if (st.done[id]) delete st.done[id]; else st.done[id] = now(); save('done');
    const on = !!st.done[id]; b.setAttribute('aria-pressed', on); b.innerHTML = on ? '<span class="tick">✓</span> Completed' : 'Mark complete';
    const t = $(`[data-tocsec="${id}"]`); if (t) t.classList.toggle('done', on); updateSide(); if (on) toast('Section marked complete'); },
  bm(b){ const id = b.dataset.id; const i = st.bm.findIndex(x => x.id === id); if (i >= 0) st.bm.splice(i,1); else st.bm.push({id, title:b.dataset.title, route:b.dataset.route, t:now()}); save('bm');
    const on = i < 0; b.setAttribute('aria-pressed', on); b.querySelector('span').textContent = on ? 'Bookmarked' : 'Bookmark'; toast(on ? 'Bookmark added' : 'Bookmark removed'); },
  bmdel(b){ st.bm = st.bm.filter(x => x.id !== b.dataset.id); save('bm'); route(); },
  copy(b){ const t = b.dataset.text; const done = () => toast('Copied to clipboard');
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done)); else fallbackCopy(t, done); },
  print(){ window.print(); },
  examfocus(b){ const on = document.body.classList.toggle('examfocus'); b.setAttribute('aria-pressed', on); toast(on ? 'Exam focus: definitions, rules and traps only' : 'Full explanations shown'); },
  kc(b){ const [lid, k] = b.dataset.k.split('-'); const c = LEC[lid].checks[+k]; const i = +b.dataset.i; const box = b.closest('.kc');
    $$('.optbtn', box).forEach((x,j) => { x.classList.remove('right','wrong'); if (j === c.a) x.classList.add('right'); else if (j === i) x.classList.add('wrong'); });
    $('.fbx', box).innerHTML = `<div class="fb ${i===c.a?'ok':'no'}"><b>${i===c.a?'Correct.':'Not quite.'}</b> ${esc(c.why)}</div>`; },
  revf(b){ revFilter = b.dataset.f; route(); },
  expand(b){ $$('details.sol').forEach(d => d.open = b.dataset.v === '1'); },
  pf(b){ practiceLec = b.dataset.f; location.hash = practiceLec === 'all' ? 'practice' : 'practice/'+practiceLec; },
  pans(b){ const id = b.dataset.id, i = +b.dataset.i, k = +b.dataset.k; st.pans[id] = i; save('pans'); st.pmiss = st.pmiss || {}; if (i !== k) st.pmiss[id] = 1; else delete st.pmiss[id]; S.set('pmiss', st.pmiss);
    const card = document.getElementById(id); const p = AD.PRACTICE.find(x => x.id === id); card.outerHTML = practiceItem(p); },
  ff(b){ formFilter = b.dataset.f; route(); },
  sheet(b){ sheetMode = b.dataset.m; route(); },
  xstart(){ const m = +($('#xmin').value) || 90; S.set('xmin', m); const sh = ($('input[name=xord]:checked')||{}).value === '1'; startExam(REV.map(r => r.id), m, sh, 'full'); },
  xgo(b){ const X = st.exam; X.idx = Math.min(X.items.length-1, Math.max(0, X.idx + (+b.dataset.d))); save('exam'); route(); },
  xjump(b){ st.exam.idx = +b.dataset.i; save('exam'); route(); },
  xmark(){ const X = st.exam; const id = X.items[X.idx]; if (X.marked[id]) delete X.marked[id]; else X.marked[id] = 1; save('exam'); route(); },
  xsubmit(){ const X = st.exam; const un = X.items.filter(id => !answered(id)).length; const mk = Object.keys(X.marked).length;
    const msg = (un ? `${un} question${un>1?'s are':' is'} unanswered. ` : '') + (mk ? `${mk} marked for review. ` : '') + 'Submit the exam now?';
    if (window.confirm(msg)) submitExam(false); },
  xquit(){ if (window.confirm('Discard this attempt? Your answers will be deleted.')){ st.exam = null; save('exam'); document.body.classList.remove('distraction'); route(); } },
  distraction(b){ const on = document.body.classList.toggle('distraction'); b.setAttribute('aria-pressed', on); },
  xself(b){ const A = st.att[+b.dataset.a]; const x = A.items.find(y => y.id === b.dataset.id); x.self = b.dataset.v === '1'; recount(A); save('att');
    const w = st.wrong[x.id] || {n:0}; if (x.self){ w.last = 'ok'; } else { w.n++; w.last = 'miss'; } st.wrong[x.id] = w; save('wrong'); route(); },
  rtab(b){ resTab = b.dataset.t; route(); },
  xretry(b){ const A = st.att[+b.dataset.i]; const ids = A.items.filter(x => x.s === 'incorrect' || x.s === 'unanswered' || (x.s === 'self' && x.self !== true)).map(x => x.id);
    if (!ids.length) return toast('Nothing to retry — every answer was correct.'); startExam(ids, Math.max(10, Math.ceil(ids.length*1.5)), false, 'retry'); },
  xretryweak(){ const ids = REV.filter(r => (st.wrong[r.id]||{}).last === 'miss').map(r => r.id); if (!ids.length) return; startExam(ids, Math.max(10, Math.ceil(ids.length*1.5)), false, 'retry'); },
  mapn(b){ mapSel = b.dataset.id; location.hash = 'map/' + mapSel; },
  t93(b){ t93 = +b.dataset.i; route(); },
  lab(b){ const s = AD.LAB.find(x => x.id === b.dataset.s); const k = +b.dataset.k, j = +b.dataset.j; const p = st.lab[s.id] || {step:0, picks:{}};
    p.picks[k] = j; if (s.steps[k].o[j][1]) p.step = Math.max(p.step, k+1); st.lab[s.id] = p; save('lab'); document.getElementById(s.id).outerHTML = scnHtml(s); },
  labreset(b){ delete st.lab[b.dataset.s]; save('lab'); const s = AD.LAB.find(x => x.id === b.dataset.s); document.getElementById(s.id).outerHTML = scnHtml(s); },
  fcflip(){ fcFlip = !fcFlip; const c = $('.fc'); if (c){ c.classList.toggle('flip', fcFlip); $('.fc .front').setAttribute('aria-hidden', fcFlip); $('.fc .back').setAttribute('aria-hidden', !fcFlip); const btn = $$('.fcctl .btn')[1]; if (btn) btn.textContent = fcFlip ? 'Show question' : 'Reveal answer'; } },
  fcnav(b){ fcIdx = Math.min(fcQueue.length-1, Math.max(0, fcIdx + (+b.dataset.d))); fcFlip = false; route(); },
  fcmark(b){ const id = fcQueue[fcIdx]; if (!id) return; const o = st.fc[id] || {n:0}; o.s = b.dataset.v; o.n++; o.t = now(); st.fc[id] = o; save('fc');
    if (fcFilter === 'review' && o.s === 'k'){ fcQueue.splice(fcIdx,1); if (fcIdx >= fcQueue.length) fcIdx = Math.max(0, fcQueue.length-1); }
    else if (fcIdx < fcQueue.length-1) fcIdx++; else { toast('End of this deck — reshuffled with review cards first'); buildQueue(); }
    fcFlip = false; route(); },
  fcreview(){ fcFilter = 'review'; buildQueue(); },
  reset(){ if (!window.confirm('Delete all progress, notes, bookmarks, flashcard history and exam attempts on this device?')) return;
    Object.keys(DEF).forEach(k => { st[k] = JSON.parse(JSON.stringify(DEF[k])); save(k); }); st.pmiss = {}; S.set('pmiss', {}); buildQueue(); toast('Study data reset'); route(); },
  replayIntro(){ showIntro(true); },
  skipIntro(){ hideIntro(); }
};
st.pmiss = S.get('pmiss', {});
function fallbackCopy(t, done){ const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('Copy is not available in this browser'); } ta.remove(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) { if (document.body.classList.contains('nav-open') && !e.target.closest('#side') && !e.target.closest('#menuBtn')) document.body.classList.remove('nav-open'); return; }
  const f = ACT[b.dataset.act]; if (!f) return;
  if (b.tagName === 'A' && b.dataset.act === 'fcreview'){ f(b); return; }
  e.preventDefault(); f(b, e);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('g.mn, tr[data-act], .fc[data-act]')){ e.preventDefault(); ACT[t.dataset.act](t); return; }
  if (e.key === 'Escape'){ if (!$('#intro').hidden) hideIntro(); document.body.classList.remove('nav-open'); }
  if (location.hash.startsWith('#flashcards') && !/input|textarea|select/i.test(t.tagName)){
    if (e.key === ' ' && !t.matches('button')){ e.preventDefault(); ACT.fcflip(); }
    else if (e.key === 'k' || e.key === 'K') ACT.fcmark({dataset:{v:'k'}});
    else if (e.key === 'r' || e.key === 'R') ACT.fcmark({dataset:{v:'r'}});
    else if (e.key === 'ArrowRight') ACT.fcnav({dataset:{d:1}});
    else if (e.key === 'ArrowLeft') ACT.fcnav({dataset:{d:-1}});
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.note){ st.notes[t.dataset.note] = t.value; clearTimeout(t._s); t._s = setTimeout(() => save('notes'), 300); }
  else if (t.dataset.xa && examRunning()){ const id = st.exam.items[st.exam.idx]; const a = st.exam.ans[id] = st.exam.ans[id] || {};
    if (t.dataset.xa === 'f'){ a.f = a.f || {}; a.f[t.dataset.i] = t.value; } else if (t.dataset.xa === 't') a.t = t.value; else a.c = t.value;
    saveExamSoon(); refreshExamStatus(); }
  else if (t.dataset.sim){ sim[t.dataset.sim][t.dataset.k] = +t.value; const o = $('#o-'+t.dataset.sim+'-'+t.dataset.k); if (o) o.textContent = t.value+'%'; $('#simout').innerHTML = simOut(); }
  else if (t.hasAttribute('data-formq')){ formQ = t.value; clearTimeout(t._s); t._s = setTimeout(() => { const pos = t.selectionStart; route(); const n = $('[data-formq]'); if (n){ n.focus(); n.setSelectionRange(pos,pos); } }, 250); }
  else if (t.hasAttribute('data-glossq')){ glossQ = t.value; clearTimeout(t._s); t._s = setTimeout(() => { const pos = t.selectionStart; route(); const n = $('[data-glossq]'); if (n){ n.focus(); n.setSelectionRange(pos,pos); } }, 250); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fcf'){ fcFilter = t.value; buildQueue(); route(); }
  else if (t.dataset.xa === 'c' && examRunning()){ const id = st.exam.items[st.exam.idx]; (st.exam.ans[id] = st.exam.ans[id] || {}).c = t.value; save('exam'); refreshExamStatus(); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.rev && d.open && !st.revSeen[d.dataset.rev]){ st.revSeen[d.dataset.rev] = now(); save('revSeen'); updateSide(); } }, true);
function refreshExamStatus(){
  const X = st.exam; const n = X.items.filter(answered).length;
  const bar = $('.exam-bar .bar i'); if (bar) bar.style.width = pct(n, X.items.length)+'%';
  const lab = $('#xcount'); if (lab) lab.textContent = `${n} / ${X.items.length} answered`;
  const btn = $(`.navq button[data-i="${X.idx}"]`); if (btn) btn.classList.toggle('a', answered(X.items[X.idx]));
}
setInterval(() => {
  if (!examRunning()) return;
  const left = st.exam.endsAt - now();
  const el = $('#xtimer'); if (el){ el.textContent = fmtClock(left); el.classList.toggle('low', left < 5*60*1000); }
  if (left <= 0) submitExam(true);
}, 1000);
window.addEventListener('beforeprint', () => { $$('details').forEach(d => { if (!d.open){ d.dataset.pc = '1'; d.open = true; } }); });
window.addEventListener('afterprint', () => { $$('details[data-pc]').forEach(d => { d.open = false; delete d.dataset.pc; }); });

/* =============================== INTRO =============================== */
let introT;
function hideIntro(){ const el = $('#intro'); if (!el || el.hidden) return; clearTimeout(introT); const off = $('#introOff'); if (off){ st.introOff = off.checked; save('introOff'); } el.classList.add('out'); setTimeout(() => { el.hidden = true; el.classList.remove('out'); }, 700); const h = $('#main h1[tabindex]'); if (h) h.focus({preventScroll:true}); }
function showIntro(force){
  const el = $('#intro'); const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!force && (st.introOff || rm)){ el.hidden = true; return; }
  const svg = $('.intro-svg', el); const clone = svg.cloneNode(true); svg.replaceWith(clone);
  const ti = $('.intro-title', el); const tc = ti.cloneNode(true); ti.replaceWith(tc);
  $('#introOff').checked = !!st.introOff; el.hidden = false; el.classList.remove('out');
  const btn = $('[data-act="skipIntro"]', el); if (btn) btn.focus({preventScroll:true});
  clearTimeout(introT); introT = setTimeout(hideIntro, rm ? 1500 : 5900);
}

/* =============================== INIT =============================== */
function init(){
  $('#nav').innerHTML = `<ul>${NAV.map(n => `<li><a href="#${n[0]}" data-r="${n[0]}">${ico(n[0])}<span>${n[1]}</span></a></li>`).join('')}</ul>`;
  const q = $('#q'); q.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); location.hash = 'search/' + encodeURIComponent(q.value.trim()); } });
  $('#qbtn').addEventListener('click', () => { location.hash = 'search/' + encodeURIComponent(q.value.trim()); });
  window.addEventListener('hashchange', route);
  route(); showIntro(false);
  if (examRunning() && st.exam.endsAt <= now()) submitExam(true);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
window.__auditApp = { route, grade, parseNum, st, REV, submitExam, ACT };
})();
