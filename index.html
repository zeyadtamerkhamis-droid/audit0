/* ============================== LECTURE 3 ============================== */
{ id:'L3', short:'Lecture 3', file:'lecture_three.pdf', pages:18, chapter:'Chapter 2: acceptance phase',
  title:'External audit of financial statements and Phase 1: accepting the client',
  objectives:[
   'Define the external audit of financial statements and state its two purposes.',
   'List the six components of the audit field.',
   'Name the applicable financial reporting framework in Egypt.',
   'State the auditor’s overall responsibility and why the opinion covers the statements as a whole.',
   'Explain the four reasons the auditor gives reasonable rather than absolute assurance.',
   'Describe the four steps of Phase 1 and the purpose of each.',
   'Recognise the main parts of an engagement letter.'
  ],
  sections:[
  { id:'L3S1', title:'Concept of external auditing of financial statements', src:'lecture_three.pdf, p. 2', html:`
${co('def','External audit of financial statements','<p>A systematic process of objectively obtaining and evaluating evidence regarding <b>management assertions about the financial statements</b> (the information being verified), to ascertain the degree of correspondence between those assertions and established criteria (the <b>applicable financial reporting framework</b>), and to communicate an <b>objective opinion</b> to final users through the <b>audit report</b>.</p>')}
<p>The lecture attaches two purposes to the definition:</p>
<ol><li>To <b>enhance the credibility</b> of the client’s financial statements.</li><li>To provide that the financial statements are <b>presented fairly, in all material respects</b>, in accordance with the applicable financial reporting framework.</li></ol>
<p class="deep">Compare with the general definition in Lecture 1: the general "assertions" become <em>management assertions about the financial statements</em>, "established criteria" become the <em>applicable financial reporting framework</em>, and "report the results" becomes an <em>objective opinion in the audit report</em>. The external audit is the general concept applied to one specific subject matter.</p>
${ar('المراجعة الخارجية للقوائم المالية = عملية منظمة وموضوعية لجمع وتقييم الأدلة عن ادعاءات الإدارة، لتحديد مدى توافقها مع الإطار المحاسبي المطبّق، وتوصيل رأي محايد للمستخدمين في تقرير المراجعة؛ الهدف: زيادة الثقة في القوائم والتأكد من أنها معروضة بعدالة من جميع النواحي الجوهرية.')}
`},
  { id:'L3S2', title:'The audit field', src:'lecture_three.pdf, p. 2', html:`
<p>The field of the external audit service is the <b>management assertions related to the entity’s financial statements</b>. The lecture diagram lists six components:</p>
<div class="chips"><span>Income statement</span><span>Owners’ equity statement</span><span>Balance sheet (statement of financial position)</span><span>Cash flow statement</span><span>Statement of comprehensive income</span><span>Related disclosure footnotes</span></div>
${co('trap','Trap','<p>The footnotes are part of the audit field. "External audit field includes income statement and balance sheet only" is wrong; the answer to Lecture 3 MCQ 2 is "all of the above". Revision Case 1 Q13 asks you to list these components without explanation.</p>')}
`},
  { id:'L3S3', title:'Established criteria in Egypt', src:'lecture_three.pdf, p. 3', html:`
<p>The criteria are the measure of credibility for management assertions — the <b>applicable financial reporting framework</b>. In Egypt it includes:</p>
<ol><li>Egyptian Accounting Standards (EAS)</li><li>International Financial Reporting Standards (IFRS)</li><li>Generally Accepted Accounting Principles (GAAP)</li><li>Related laws and regulations (for example, tax law)</li></ol>
${co('trap','Trap','<p>GAAS is <b>not</b> part of the framework: it is the set of auditing standards the auditor follows (Lecture 3 MCQ 4; assignment Q25).</p>')}
`},
  { id:'L3S4', title:'The auditor’s overall responsibility', src:'lecture_three.pdf, p. 3', html:`
${co('def','Overall responsibility of the auditor','<p>In conducting an audit, the auditor’s overall responsibility is to <b>obtain reasonable assurance</b> about whether the financial statements <b>as a whole</b> (not each statement separately) are <b>free from material misstatement, whether due to fraud or error</b>, thereby enabling the auditor to express an <b>opinion</b> on whether they are presented fairly, in all material respects, in accordance with the applicable financial reporting framework.</p>')}
<p>Four elements are tested repeatedly: <em>reasonable</em> assurance (not absolute); the statements <em>as a whole</em>; <em>material</em> misstatement (not every error); and misstatement due to <em>fraud or error</em>.</p>
${co('trap','Trap','<p>"Auditors provide an opinion on separate accounts and on each separate financial statement independently" — false (Lecture 3 case T/F 2).</p>')}
`},
  { id:'L3S5', title:'Reasonable — not absolute — assurance', src:'lecture_three.pdf, p. 4', html:`
<p>The auditor is responsible for reasonable, but not absolute, assurance for four reasons:</p>
<div class="tbl"><table><thead><tr><th>Reason</th><th>Explanation</th></tr></thead><tbody>
<tr><td>1. Sampling</td><td>Most audit evidence results from <b>testing a sample</b> of a population such as accounts receivable or inventory. Sampling inevitably includes some risk of not uncovering a material misstatement.</td></tr>
<tr><td>2. Complex estimates</td><td>Accounting presentations contain <b>complex estimates</b> that involve uncertainty and can be affected by future events.</td></tr>
<tr><td>3. Fraud is hard to detect</td><td>Fraudulently prepared statements are often extremely <b>difficult, if not impossible, to detect</b>, especially when there is collusion among management.</td></tr>
<tr><td>4. Cost</td><td>If auditors had to make certain that every assertion was 100% correct, the evidence and cost would rise so much that audits would <b>not be economically practical</b>.</td></tr>
</tbody></table></div>
${co('why','Link to audit risk','<p>Reason 1 is the same idea as <b>sampling risk</b> in the audit-risk model (Lectures 4&amp;5): detection risk can never be zero. Absolute assurance would mean zero audit risk, which the lecture says is impossible.</p>')}
${ar('التأكيد معقول وليس مطلقًا لأربعة أسباب: الاعتماد على العينات، وجود تقديرات محاسبية معقدة، صعوبة اكتشاف الغش خاصة مع التواطؤ، وأن التأكيد المطلق يجعل التكلفة غير اقتصادية.')}
`},
  { id:'L3S6', title:'Reading the definition as an exam case', src:'lecture_three.pdf, pp. 5–6', html:`
<p>The 3rd case study turns the definition into nine short questions. The model answers (provided in the file) map directly to the definition:</p>
<div class="tbl"><table><thead><tr><th>Question</th><th>Answer in the file</th></tr></thead><tbody>
<tr><td>Type of service</td><td>An attestation and assurance service</td></tr>
<tr><td>Provider</td><td>The external auditor (CPA)</td></tr>
<tr><td>Why systematic</td><td>Four phases, performed according to professional standards (GAAS)</td></tr>
<tr><td>Management assertions at statement level</td><td>Existence and occurrence; completeness; valuation and allocation; rights and obligations; presentation and disclosure</td></tr>
<tr><td>Field of the audit</td><td>Financial statements including management assertions</td></tr>
<tr><td>Final product</td><td>Auditor’s opinion</td></tr>
<tr><td>Delivery method</td><td>Written audit report</td></tr>
<tr><td>Who relies on it</td><td>Stakeholders (investors, shareholders, regulators)</td></tr>
<tr><td>Measurement criteria</td><td>Applicable financial reporting framework</td></tr>
</tbody></table></div>
${co('def','The five management assertions (as listed in the answer)','<ol><li>Existence and occurrence</li><li>Completeness</li><li>Valuation and allocation</li><li>Rights and obligations</li><li>Presentation and disclosure</li></ol><p>The file lists the names only; the detailed testing of each assertion belongs to the fieldwork chapter, which is not uploaded.</p>')}
`},
  { id:'L3S7', title:'The four phases of the external audit service', src:'lecture_three.pdf, p. 10', html:`
${flow(['<b>First</b><span>Acceptance of the audit client engagement</span>','<b>Second</b><span>Planning the audit approach</span>','<b>Third</b><span>Field work: implementing procedures</span>','<b>Fourth</b><span>Reporting</span>'])}
<p>Together the four phases form the external audit process carried out by the external auditor.</p>
`},
  { id:'L3S8', title:'Phase 1: deciding whether to accept the client', src:'lecture_three.pdf, pp. 10–11', html:`
<p>The first phase decides whether to accept the client. Lecture 3 presents it in <b>four key steps</b>; Lecture 6 adds a fifth (issue the engagement letter).</p>
<div class="steps-v">
<div><b>Step 1 — Evaluate the new or existing client entity</b><p>Before accepting the engagement, the auditor assesses the client to identify potential problem clients in advance and any limitation that will be imposed on the auditor.</p></div>
<div><b>Step 2 — Identify the reasons why the client needs to be audited</b><p>Regulatory requirement (listed firms), applying for a bank loan, or providing more information to interested users. The reason affects the planning of the audit in terms of <b>time allocation and effort</b>.</p></div>
<div><b>Step 3 — Assign the appropriate staff</b><p>Ensure the audit team has the right <b>qualifications, skills and availability</b> to perform the audit on the agreed date.</p></div>
<div><b>Step 4 — Agree the fees</b><p>The auditor should negotiate and agree the audit fees <b>before accepting</b> the engagement.</p></div>
</div>
${co('trap','Exam favourites (Lecture 6 MCQ and T/F)','<ul><li>First step in accepting a new engagement → evaluating the client entity.</li><li>Why identify the reasons for the audit → to plan the audit in terms of time and effort.</li><li>Assigning staff ensures qualifications and availability.</li><li>Fees are agreed before accepting the engagement and are part of client acceptance.</li><li>Client evaluation applies to new <em>and existing</em> clients.</li></ul>')}
${ar('مرحلة القبول: (1) تقييم العميل الجديد أو الحالي لاكتشاف أي مشكلات أو قيود، (2) معرفة سبب المراجعة لأنه يؤثر على الوقت والجهد، (3) تكليف فريق مؤهل ومتاح، (4) الاتفاق على الأتعاب قبل القبول. ثم في المحاضرة 6: (5) إصدار خطاب التكليف.')}
`},
  { id:'L3S9', title:'The engagement letter (textbook exhibit)', src:'lecture_three.pdf, pp. 13–14 (Figure 8-2)', html:`
<p>The lecture reproduces a textbook engagement letter (Figure 8-2) from a CPA firm to the president of a clothing company. Its content is summarised here; it is analysed item by item in Lecture 6.</p>
<div class="tbl"><table><thead><tr><th>Part of the letter</th><th>What it establishes</th></tr></thead><tbody>
<tr><td>Scope</td><td>Audit of the balance sheet as of December 31, 2016 and the related statements of income, changes in stockholders’ equity and cash flows, with notes</td></tr>
<tr><td>Objective</td><td>Expressing an opinion on the financial statements</td></tr>
<tr><td>Standards</td><td>Auditing standards generally accepted in the United States (GAAS), requiring reasonable assurance that the statements are free from material misstatement</td></tr>
<tr><td>Inherent limitations</td><td>An unavoidable risk that some material misstatements may not be detected, even in a properly planned audit</td></tr>
<tr><td>Internal control</td><td>Considered for risk assessment only — not to express an opinion on its effectiveness; significant deficiencies and material weaknesses will be communicated in writing</td></tr>
<tr><td>Management responsibilities</td><td>Preparing fairly presented statements under US GAAP; internal control; giving access to information and people; written representations</td></tr>
<tr><td>Other service</td><td>Preparing federal and state income tax returns</td></tr>
<tr><td>Fees</td><td>Billed as work progresses, based on time plus out-of-pocket expenses; initial estimate of total fees $135,000</td></tr>
<tr><td>Report</td><td>Addressed to the board of directors; no guarantee that an unmodified opinion will be expressed — the opinion may be modified, emphasis/other-matter paragraphs added, or the auditor may withdraw</td></tr>
<tr><td>Acceptance</td><td>Client signs and returns a copy to acknowledge the arrangements</td></tr>
</tbody></table></div>
`},
  { id:'L3S10', title:'Practice sets in this lecture', src:'lecture_three.pdf, pp. 5–9, 15–18', html:`
<p>Lecture 3 contains a definition-based case study (answers provided), a 4th multiple-choice set (no key), a 5th case study on reasonable assurance (answers provided) and an in-class assignment numbered 5 to 28 (no key; two questions share number 8). All are solved in the <a href="#practice/L3">Practice Bank</a>.</p>
`}
  ],

/* ============================== LECTURES 4 & 5 ============================== */
{ id:'L45', short:'Lectures 4 & 5', file:'lec_4__5.pdf', pages:9, chapter:'Chapter 2: planning phase',
  title:'Phase 2: planning the audit approach with the audit risk model',
  objectives:[
   'State the objective of the planning phase and list its four steps.',
   'Describe the risk assessment procedures used to understand the entity and its environment.',
   'Explain how tests of controls lead to the assessment of control risk.',
   'Define audit risk, inherent risk, control risk, detection risk and the risk of material misstatement.',
   'Apply AR = IR × CR × DR and AR = RMM × DR to solve for any unknown.',
   'Explain how planned detection risk changes the nature, extent, timing and allocated materiality of procedures.',
   'Read Table 9-3 and explain each situation.',
   'Calculate the material misstatement limit and decide whether a misstatement is material.'
  ],
  sections:[
  { id:'L45S1', title:'The objective of planning and the four steps', src:'lec_4__5.pdf, pp. 1–2', html:`
${co('def','Objective of the planning stage','<p>To develop an <b>audit strategy and audit plan</b> — the nature, timing and extent of procedures.</p>')}
${flow(['<b>Step 1</b><span>Obtain an understanding of the entity and its environment<br><em>Risk assessment procedures → client business risk</em></span>','<b>Step 2</b><span>Understand internal control and assess control risk<br><em>Preliminary test of controls → rely on the ICS according to the control-risk level</em></span>','<b>Step 3</b><span>Assess the risk of material misstatement (RMM)<br><em>Using the audit risk model</em></span>','<b>Step 4</b><span>Develop the audit strategy and audit plan<br><em>Nature, extent, timing, allocated (performance) materiality</em></span>'])}
<p>The lecture’s own Arabic question captures the logic: <span dir="rtl" lang="ar">«براجع انهي حسابات اكتر بناء علي ايه؟»</span> — on what basis do I audit some accounts more than others? The answer is the audit risk model: the auditor determines the scope, extent and timing of tests according to the level of audit risk assessed.</p>
`},
  { id:'L45S2', title:'Step 1: understand the entity and its environment', src:'lec_4__5.pdf, pp. 1, 5 (Figure 9-2)', html:`
<p>Auditing standards require <b>risk assessment procedures</b> to understand the client’s business, industry and external environment, in order to identify risks:</p>
<div class="tbl"><table><thead><tr><th>Procedure</th><th>Lecture illustration</th></tr></thead><tbody>
<tr><td>Inquiry</td><td>Of staff and management</td></tr><tr><td>Observation</td><td>Of business processes</td></tr><tr><td>Inspection</td><td>Of policies and contracts</td></tr><tr><td>Preliminary analytical procedures</td><td>—</td></tr></tbody></table></div>
${co('ex','Lecture example','<p>The auditor of an insurance company must understand how <b>loss reserves</b> are calculated. This helps identify client business risk and the risk of material misstatement.</p>')}
<h4>Figure 9-2: what "understanding" covers</h4>
<p>Five areas feed the understanding of the client’s business and industry:</p>
<div class="chips"><span>Industry and external environment</span><span>Business operations and processes</span><span>Management and governance</span><span>Objectives and strategies</span><span>Measurement and performance</span></div>
${flow(['<b>Understand client’s business and industry</b>','<b>Assess client business risk</b>','<b>Assess risk of material misstatements</b><span>split into inherent risk (IR) and control risk (CR)</span>'])}
<div class="formula">PDR = AAR ÷ (IR × CR)</div>
<p>Figure 9-2 prints the model in solved form: planned detection risk equals acceptable audit risk divided by inherent risk times control risk.</p>
`},
  { id:'L45S3', title:'Step 2: understand internal control and assess control risk', src:'lec_4__5.pdf, p. 1', html:`
<p>The auditor performs <b>tests of controls</b> to evaluate the effectiveness of internal controls — that is, the ability of the client’s internal controls to generate reliable financial information and to safeguard assets and records — in order to decide whether he can <b>rely on them</b> and to <b>assess control risk</b>.</p>
${co('ex','Lecture example of a control','<p>Matching the sales order, the shipping document and the invoice before sending invoices.</p>')}
<p class="deep">The stronger the controls proved by these tests, the lower the assessed control risk and the more the auditor can rely on the internal control system (ICS). The summary diagram on page 2 states this as "rely on ICS according to control risk level".</p>
`},
  { id:'L45S4', title:'Step 3: assess the risk of material misstatement', src:'lec_4__5.pdf, p. 1', html:`
<p>The auditor uses his understanding of the client’s industry and business strategies, together with the effectiveness of controls, to assess the risk of misstatement in the financial statements. In the model this is <b>RMM = IR × CR</b>.</p>
${co('note','Source wording','<p>The file reads "effectiveness of cultures" and "missus statements"; in context these mean the effectiveness of <b>controls</b> and <b>misstatements</b>.</p>')}
`},
  { id:'L45S5', title:'Step 4: audit strategy, audit program and audit plan', src:'lec_4__5.pdf, pp. 1, 4', html:`
<p>Responding to the assessed risks, the auditor decides the <b>nature, timing and extent</b> of planned procedures and the allocated (performance) materiality. The plan depends on the calculated detection risk:</p>
<div class="tbl"><table><thead><tr><th></th><th>Lower detection risk</th><th>Higher detection risk</th></tr></thead><tbody>
<tr><td><b>Nature</b> (type of procedures)</td><td>More effective evidence</td><td>Less effective evidence</td></tr>
<tr><td><b>Extent</b> (number and size of samples)</td><td>More evidence — larger sample</td><td>Less evidence — smaller sample</td></tr>
<tr><td><b>Timing</b></td><td>Testing near year end</td><td>Testing can be at interim (during the year)</td></tr>
<tr><td><b>Allocated materiality</b></td><td>Lower</td><td>Higher</td></tr>
</tbody></table></div>
${co('rule','Rule','<p>High risk of material misstatement → low planned detection risk → more effective tests, more tests, near year end, lower performance materiality.</p>')}
${co('trap','Trap','<p>When acceptable detection risk increases, the auditor may move substantive tests to an interim date (Revision MCQ 7 → a). Increasing sample size is the response to a <em>lower</em> DR.</p>')}
${ar('كلما انخفض خطر الاكتشاف المخطط زادت فعالية الإجراءات (طبيعتها)، وزاد حجم العينات (مداها)، وأصبح التوقيت قرب نهاية السنة، وانخفضت الأهمية النسبية المخصصة.')}
`},
  { id:'L45S6', title:'Audit risk and its components', src:'lec_4__5.pdf, p. 3', html:`
${co('def','Audit risk','<p>The probability that the auditor will issue an <b>unqualified (clean) opinion</b> on financial statements that are, in fact, <b>materially misstated</b>.</p>')}
<div class="formula">AR = IR × CR × DR</div>
<div class="tbl"><table><thead><tr><th>Component</th><th>Lecture definition</th></tr></thead><tbody>
<tr><td><b>Inherent risk (IR)</b></td><td>The susceptibility of a class of transactions, account balance or disclosure to be misstated, associated with the unique characteristics of the client’s industry. Example: industries with a heavy volume of cash transactions, or products that are hard to value such as diamonds, have higher inherent risk.</td></tr>
<tr><td><b>Control risk (CR)</b></td><td>The likelihood that the internal control structure is inadequate to prevent or detect material misstatements in transactions, account balances or disclosures.</td></tr>
<tr><td><b>Detection risk (DR)</b></td><td>The likelihood that the auditor’s substantive audit procedures fail to detect material misstatements in transactions, account balances or disclosures.</td></tr>
</tbody></table></div>
${flow(['<b>Audit risk (AR)</b><span>Set at low</span>','<b>RMM = IR × CR</b><span>Auditee risk — if high</span>','<b>DR</b><span>Auditor risk — so low</span>'])}
<div class="formula">AR = RMM × DR</div>
<p>The lecture’s arrow line "Set at low = if high so low" reads: audit risk is <b>set</b> low by the auditor; if the auditee’s risk (RMM) is <b>high</b>, then detection risk must be <b>low</b>.</p>
${co('note','Source wording','<p>The file writes "AR = IR x CT x DR"; CT is a typo for CR.</p>')}
${ar('خطر المراجعة = احتمال إصدار رأي نظيف على قوائم محرّفة جوهريًا. مكوناته: الخطر الملازم (طبيعة النشاط/الحساب)، خطر الرقابة (ضعف نظام الرقابة الداخلية)، وخطر الاكتشاف (فشل إجراءات المراجع التفصيلية). الملازم × الرقابة = خطر التحريف الجوهري (خطر العميل)، وخطر الاكتشاف هو خطر المراجع.')}
`},
  { id:'L45S7', title:'Who sets what: the component table', src:'lec_4__5.pdf, p. 4', html:`
<div class="tbl"><table><thead><tr><th>AR</th><th>IR</th><th>CR</th><th>DR</th></tr></thead><tbody><tr>
<td><b>Acceptable audit failure</b> — the risk of not detecting material misstatement. The auditor <b>determines (sets)</b> the acceptable level depending on the accounting firm’s policy and the account under audit. Cannot be zero (no absolute assurance); preferred not to be high.</td>
<td>The risk that the client’s environment or circumstances may generate material misstatement. The auditor only <b>understands and assesses</b> it through risk assessment. <b>Cannot be zero.</b></td>
<td>The risk that the client’s internal control over financial statements may generate material misstatements (controls ineffective). The auditor finds the CR level <b>after testing</b> internal-control effectiveness. <b>Cannot be zero.</b></td>
<td>The risk that the auditor, by his work, fails to detect material misstatements. <b>Cannot be zero</b> because of <b>sampling risk</b> (a bad sample is chosen) and <b>non-sampling risk</b> (the wrong evidence or test is chosen).</td>
</tr></tbody></table></div>
${co('rule','Key principle','<p>The auditor does <b>not choose</b> the level of RMM (client risk); he only assesses and evaluates it. He <b>sets</b> AR, <b>assesses</b> IR and CR, and <b>plans</b> DR as the balancing figure.</p>')}
${co('why','Why it matters','<p>Revision MCQ 6: when the assessed CR rises and AR must stay the same, the only variable the auditor controls is DR → decrease detection risk. Increasing IR is not an option because IR is assessed, not chosen.</p>')}
`},
  { id:'L45S8', title:'Table 9-3: relationships of risk to evidence', src:'lec_4__5.pdf, p. 5', html:`
<div class="tbl"><table><thead><tr><th>Situation</th><th>Acceptable audit risk</th><th>Inherent risk</th><th>Control risk</th><th>Planned detection risk</th><th>Evidence required</th></tr></thead><tbody>
<tr><td>1</td><td>High</td><td>Low</td><td>Low</td><td>High</td><td>Low</td></tr>
<tr><td>2</td><td>Low</td><td>Low</td><td>Low</td><td>Medium</td><td>Medium</td></tr>
<tr><td>3</td><td>Low</td><td>High</td><td>High</td><td>Low</td><td>High</td></tr>
<tr><td>4</td><td>Medium</td><td>Medium</td><td>Medium</td><td>Medium</td><td>Medium</td></tr>
<tr><td>5</td><td>High</td><td>Low</td><td>Medium</td><td>Medium</td><td>Medium</td></tr>
</tbody></table></div>
<p>Each row follows from PDR = AAR ÷ (IR × CR):</p>
<ul><li><b>Situation 1:</b> a high acceptable risk (large numerator) and low client risk (small denominator) give the highest DR — little evidence.</li>
<li><b>Situation 2:</b> low AR pulls DR down, low IR and CR push it up — the effects offset to a medium DR.</li>
<li><b>Situation 3:</b> the worst case — low AR and high IR and CR give a low DR and the most evidence.</li>
<li><b>Situation 4:</b> everything medium gives medium.</li>
<li><b>Situation 5:</b> high AR and low IR push up, medium CR pulls back — medium.</li></ul>
${co('rule','Two inverse relationships','<p>Acceptable audit risk and the evidence required are <b>inversely</b> related (Revision T/F 8). Planned detection risk and the evidence required are <b>inversely</b> related.</p>')}
${co('trap','Discrepancy you should know about','<p>Revision T/F 7 ("AR low, IR and CR low → DR should be Low") is false. The revision key corrects it to "high"; Table 9-3, Situation 2 shows exactly this combination as <b>medium</b>. Either way, it is not low. Write "false — not low (medium per Table 9-3)" and confirm the expected wording with your lecturer.</p>')}
`},
  { id:'L45S9', title:'Worked examples 1–3', src:'lec_4__5.pdf, pp. 6–8', html:`
<h4>Example 1</h4>
<p>AR = 5%, IR = 40%, CR = 60%.</p>
<ol class="steps"><li><b>(a)</b> DR = AR ÷ (IR × CR) = 0.05 ÷ (0.40 × 0.60) = 0.05 ÷ 0.24 = 0.2083 → the lecture rounds to <b>20%</b>.</li>
<li><b>(b)</b> CR reduced to 40%: DR = 0.05 ÷ (0.40 × 0.40) = 0.05 ÷ 0.16 = 0.3125 → <b>31%</b>.</li></ol>
<p>The first case needs a lower DR (20%) because its internal control is riskier (CR 60% vs 40%), so the auditor performs more substantive tests in the first case.</p>
${co('note','Source wording','<p>The lecture’s closing sentence says the second example is the one "where the detection risk is lower while control risk is higher". The figures show the reverse: in the second example DR is <b>higher</b> (31%) and CR is <b>lower</b> (40%).</p>')}
<h4>Example 2</h4>
<p>AR = 10%, IR = 80%, CR = 90% (controls not functioning effectively).</p>
<ol class="steps"><li>DR = 0.10 ÷ (0.80 × 0.90) = 0.10 ÷ 0.72 = 0.1389 → <b>14%</b>.</li></ol>
<h4>Example 3 — XYZ Co., 2023, accounts receivable</h4>
<p>IR = 60%, CR = 60%, A/R balance = 70,000 L.E., total audit risk = 0.02, materiality threshold = 2%.</p>
<ol class="steps">
<li><b>Planned DR</b> = 0.02 ÷ (0.6 × 0.6) = 0.02 ÷ 0.36 = 0.0556 → lecture shows <b>0.055 = 5.5%</b>.</li>
<li><b>RMM</b> = AR ÷ DR = 0.02 ÷ 0.055 = 0.36, or directly IR × CR = 0.6 × 0.6 = <b>0.36</b>. RMM is always inversely related to DR.</li>
<li><b>Material misstatement limit</b> = A/R balance × materiality level = 70,000 × 0.02 = <b>1,400 L.E.</b></li>
<li><b>Opinion:</b> misstatement found 1,500 &gt; 1,400 → the misstatement is material → the lecture concludes a <b>qualified opinion</b>.</li></ol>

{ id:'R-C1-5', grp:'case', cs:'RC1', num:'5', type:'text', q:'Which account is the riskier account from auditor perspective?',
  ans:'Company B — accounts receivable.',
  expl:'Compare client risk and the room left for the auditor: RMM A = 5%, B = 16%, C = 3%. Company B carries the highest RMM, which forces the lowest planned DR (12.5% vs 20% and 20%), so the auditor has the least margin for error there. B also has the highest acceptable AR (0.02), but that is a policy setting, not client risk.',
  trap:'Interpretation flag: if "riskier from auditor perspective" is read literally as the highest <em>auditor risk</em> (DR), Companies A and C tie at 20% and the question has no single answer. The reading above (riskiest = highest RMM, lowest DR) is the one consistent with Q6–Q8. State your reading in the exam.',
  src:'lec7 p. 5; lec_4__5.pdf pp. 3–4', lec:L('L45S7'), topics:['rmm','dr'], flag:true },
{ id:'R-C1-6', grp:'case', cs:'RC1', num:'6', type:'text', q:'Which account suffers from a weaker internal control structure? Why?',
  ans:'Company B (accounts receivable), because it has the highest control risk: 40% vs 30% (C) and 25% (A).',
  expl:'Control risk measures the likelihood that internal control fails to prevent or detect material misstatements. The higher the CR, the weaker the control structure. B = 0.4 > C = 0.3 > A = 0.25.',
  src:'lec7 p. 5', lec:L('L45S6'), topics:['cr'] },
{ id:'R-C1-7', grp:'case', cs:'RC1', num:'7', type:'text', q:'Which account needs more procedures (mainly substantive procedures)? Why?',
  ans:'Company B (accounts receivable), because it has the lowest planned detection risk: 12.5% vs 20% for A and C.',
  expl:'A lower DR means the substantive procedures must be more effective (nature), larger (extent), performed near year end (timing) and use a lower allocated materiality. B’s low DR results from its high RMM (16%).',
  src:'lec7 p. 5; lec_4__5.pdf p. 4', lec:L('L45S5'), topics:['dr','nte'] },
{ id:'R-C1-8', grp:'case', cs:'RC1', num:'8', type:'num', q:'Which accounts has the highest risk of material misstatement ? show your calculations',
  fields:[{l:'RMM — Co A', v:0.05, k:'r'},{l:'RMM — Co B', v:0.16, k:'r'},{l:'RMM — Co C', v:0.03, k:'r'}], text:true,
  ans:'Company B: RMM = 16% (A = 5%, C = 3%).',
  calc:steps({g:'A: IR 0.2, CR 0.25 · B: IR 0.4, CR 0.4 · C: IR 0.1, CR 0.3', f:'RMM = IR × CR', w:'RMM combines inherent and control risk — the auditee’s risk.', s:'A: 0.2 × 0.25; B: 0.4 × 0.4; C: 0.1 × 0.3', c:'A = 0.05; B = 0.16; C = 0.03', a:'<b>Highest RMM: Company B (accounts receivable), 16%</b>', i:'Highest client risk → lowest DR → most substantive work (consistent with Q7).'}),
  src:'lec7 p. 5', lec:L('L45S6'), topics:['rmm'], formulas:['F3'] },
{ id:'R-C1-9', grp:'case', cs:'RC1', num:'9', type:'num', q:'What is the level of Material misstatement of inventory account of Company A?',

{ id:'R-C1-10', grp:'case', cs:'RC1', num:'10', type:'text', q:'Assume the auditor of Company A detected a misstatement of 60,000 in the inventory account of Company A ? will it be material or not and why?',
  ans:'Material — 60,000 exceeds the 50,000 limit.',

  src:'lec7 p. 5', lec:L('L45S10'), topics:['materiality'], formulas:['F6'] },
{ id:'R-C1-12', grp:'case', cs:'RC1', num:'12', type:'text', q:'Assume the auditor of Company B detected a misstatement of 55,000 in the Accounts receivable account of Company B ? will it be material or not and why?',

  src:'lecture_three.pdf p. 2', lec:L('L3S2'), topics:['field'] },
{ id:'R-C1-14', grp:'case', cs:'RC1', num:'14', type:'text', q:'Main five management assertions related with financial statements? And implications of IT on it',
  ans:'Existence and occurrence; completeness; valuation and allocation; rights and obligations; presentation and disclosure.',
  expl:'The five assertions are listed in the Lecture 3 case-study answer (Q4).<div class="co supp"><b>Supplementary — not in the uploaded lectures</b><p>The "implications of IT" part is not covered in any uploaded file. As general guidance only: in IT environments evidence is often electronic, so the auditor relies more on system controls — input validation and access controls (existence/occurrence), automated sequence and interface checks (completeness), automated calculations protected by IT general controls (valuation), electronic records of ownership and contracts (rights and obligations) and system-generated reports and mappings (presentation and disclosure). Confirm the expected content with your lecturer.</p></div>',
  trap:'Coverage flag: IT implications are not taught in the uploaded material.',
  src:'lecture_three.pdf p. 5', lec:L('L3S6'), topics:['assertions'], flag:true },

{set:'L3-AS', n:'13', type:'tf', q:'IF You are the auditor of XYZ co, you were hired to audit their financial statements annually and throughout the year. According to the auditing standards you have to perfume the same amount of procedures in the annual financial statements audit as in the interim review of financial statements. (More procedures- More Effort)', a:false, why:'The file’s own hint: the audit needs more procedures and more effort.'},
{set:'L3-AS', n:'14', type:'mcq', q:'You are the auditor of XYZ co, you reviewed the interim financial statements issued March 31, in your audit report you can issue a/an', o:[['a','Opinion'],['b','Conclusion'],['c','Neither'],['d','Either']], a:1, why:'Review → conclusion.'},
{set:'L3-AS', n:'15', type:'tf', q:'Publicly listed firms are required by laws to have only their annual financial statements audited.', a:false, why:'Their interim statements must also be reviewed.'},
{set:'L3-AS', n:'16', type:'tf', q:'Annual Financial statement audit result in Negative form of the audit report', a:false, why:'The audit gives a positive form ("In our opinion").'},
{set:'L3-AS', n:'17', type:'tf', q:'In an Interim Review of financial statements, the auditor can provide a reasonable assurance that financial statements are free from material misstatement.', a:false, why:'A review gives limited assurance.'},
{set:'L3-AS', n:'18', type:'mcq', q:'You were hired as an auditor in the Governmental audit office (GAO) in Egypt, you and your team were assigned to audit the financial statements of Abu-Keer fertilizers, which of the following procedures you will need to perform in this engagement', o:[['a','Discussing Budgets performed by management and recalculate the allocation basis of overhead costs.'],['b','Examine the environmental disclosures required by Egyptian laws were properly made.'],['c','Recalculate the Depreciation Bases used and Accumulated depreciation of machines and equipment’s used.'],['d','All of the above']], a:3, why:'Governmental auditors perform financial, operational and compliance audits: budgets (operational), legal disclosures (compliance), depreciation (financial).'},
{set:'L3-AS', n:'19', type:'mcq', q:'As a fresh graduate of an accounting department of business school, you want to pursue a career in auditing. Which of the following you can currently pursue', o:[['a','Junior auditor'],['b','Forensic Auditor'],['c','Governmental auditor'],['d','a and c'],['d','a and b']], a:3, why:'Forensic auditors are trained and certified fraud examiners (ACFE); a fresh graduate can start as a junior auditor or a governmental auditor.', flag:'The file labels two options "d"; the answer is the option reading "a and c". No key is provided.'},
{set:'L3-AS', n:'20', type:'mcq', q:'you are the internal auditor of XYZ co , you report directly to the Chief Financial Officer , you are compromising your', o:[['a','Independence in fact'],['b','Independence in appearance'],['b','Organizational structure'],['d','All of the Above']], a:2, why:'Internal auditors’ independence is organisational: they should report to the BOD or audit committee. Reporting to the CFO, whose area they audit, compromises it.', flag:'The file labels two options "b"; the answer is "Organizational structure".'},
{set:'L3-AS', n:'21', type:'mcq', q:'you are the External auditor of XYZ co , you own 20% of the company shares , but you manage to keep an unbiased mind set in your audit procedures. you are compromising your', o:[['a','Independence in fact'],['b','Independence in appearance'],['b','Organizational independence'],['d','All of the Above']], a:0, why:'Using the lecture table’s definitions (lecture_two.pdf p. 19): independence in fact = no direct relationship with the client — owning 20% of the shares breaks it; independence in appearance = unbiased mental attitude — kept. Answer (a).', flag:'Many textbooks define the two the other way round (fact = mental attitude; appearance = perception of relationships), which gives (b). Confirm which definition your lecturer uses.'},
{set:'L3-AS', n:'22', type:'mcq', q:'Recording, classifying, and summarizing economic events in a logical manner for the purpose of providing financial information for decision making is commonly called:', o:[['a','finance.'],['B','auditing.'],['c','accounting.'],['d','economics.']], a:2, why:'This is the definition of accounting; auditing verifies that information.'},
{set:'L3-AS', n:'23', type:'mcq', q:'In the audit of historical financial statements, which of the following accounting bases is the most common Criteria used by auditors?', o:[['a','Regulatory accounting principles.'],['B','Cash basis of accounting.'],['c','Generally accepted accounting principles .'],['D','Liquidation basis of accounting.']], a:2, why:'GAAP (or IFRS) are the usual criteria.'},
{set:'L3-AS', n:'24', type:'tf', q:'The criteria by which an auditor evaluates the information under audit may vary with the information being audited.', a:true, why:'Each audit type uses its own criteria (Lecture 2, p. 16).'},
{set:'L3-AS', n:'25', type:'tf', q:'The criteria used by an external auditor to evaluate published financial statements are known as generally accepted auditing standards.', a:false, why:'The criteria are the applicable financial reporting framework (GAAP/IFRS/EAS); GAAS are auditing standards.'},
{set:'L3-AS', n:'26', type:'tf', q:'The criteria used by an external auditor to gather appropriate evidence on auditing published financial statements are known as generally accepted auditing standards.', a:true, why:'GAAS guide how the auditor performs the audit and gathers evidence.'},
{set:'L3-AS', n:'27', type:'tf', q:'Attestation engagement on a client web site security and integrity is non assurance service provided by the auditor', a:false, why:'WebTrust/SysTrust are attestation services on IT — assurance services.'},
{set:'L3-AS', n:'28', type:'tf', q:'Egyptian listed companies require obligatory attestation on green house gas compliance for all listed firms since 2018 .', a:false, why:'The lecture marks corporate-governance compliance as obligatory; GHG is listed only as an example.'},

{set:'L6-C1', n:'1', type:'short', q:'Calculate level of control risk for inventory account of client (1)?', ans:steps({g:'AR 0.02, IR 0.23, DR 0.2', f:'CR = AR ÷ (IR × DR)', c:'0.23 × 0.2 = 0.046; 0.02 ÷ 0.046 = 0.4348', a:'<b>CR ≈ 43.48%</b>'})},
{set:'L6-C1', n:'2', type:'short', q:'Calculate level of RMM for inventory account of client (1)?', ans:steps({g:'AR 0.02, DR 0.2 (or IR 0.23 × CR 0.4348)', f:'RMM = AR ÷ DR = IR × CR', c:'0.02 ÷ 0.2 = 0.10; 0.23 × 0.4348 = 0.10', a:'<b>RMM = 10%</b>'})},
{set:'L6-C1', n:'3', type:'short', q:'Calculate level of detection risk for inventory account of client (2)?', ans:steps({g:'AR 0.03, IR 0.5, CR 0.5', f:'DR = AR ÷ (IR × CR)', c:'0.03 ÷ 0.25 = 0.12', a:'<b>DR = 12%</b>'})},
{set:'L6-C1', n:'4', type:'short', q:'Calculate level of RMM for inventory account of client (2)?', ans:steps({g:'IR 0.5, CR 0.5', f:'RMM = IR × CR', c:'0.5 × 0.5 = 0.25; check 0.03 ÷ 0.12 = 0.25', a:'<b>RMM = 25%</b>'})},
{set:'L6-C1', n:'5', type:'short', q:'Calculate level of AP risk for inventory account of client (1)?', ans:steps({g:'DR 0.2, TD 0.4', f:'DR = AP × TD → AP = DR ÷ TD (implied by the case — see flag)', c:'0.2 ÷ 0.4 = 0.5', a:'<b>AP risk = 50%</b>'}), flag:'DR = AP × TD is not stated in the notes; it is the only relationship that makes the case solvable.'},
{set:'L6-C1', n:'6', type:'short', q:'Calculate level of TD risk for inventory account of client (2)?', ans:steps({g:'DR 0.12 (Q3), AP 0.4', f:'TD = DR ÷ AP (implied)', c:'0.12 ÷ 0.4 = 0.3', a:'<b>TD risk = 30%</b>'}), flag:'Same assumption as Q5.'},
{set:'L6-C1', n:'7', type:'short', q:'Which accounts suffer from a week internal control structure? Why?', ans:'<b>Client (2)</b> — CR 50% vs about 43.5% for client (1).'},
{set:'L6-C1', n:'8', type:'short', q:'Which accounts need more procedures (mainly substantive procedures)? Why?', ans:'<b>Client (2)</b> — lower DR (12% vs 20%) because its RMM is higher (25% vs 10%).'},
{set:'L6-C1', n:'9', type:'short', q:'Calculate limit of material misstatement for inventory account of client (1)? And what does it refer to?', ans:'5,000,000 × 0.01 = <b>50,000</b>. It is the maximum misstatement that can exist in the inventory balance without being material; a larger misstatement would affect users’ decisions and the opinion.'},
{set:'L6-C1', n:'10', type:'short', q:'Calculate overall assurance required for inventory account of client (2)?', ans:'Assurance = 1 − AR = 1 − 0.03 = <b>97%</b>.'},
{set:'L6-C1', n:'11', type:'short', q:'If you detected a misstatement in the inventory account of client (1) for 60,000 no other misstatement was found what should be your audit opinion and which standard would you apply.', ans:'60,000 &gt; 50,000 → material → following lecture Example 3, a <b>qualified opinion</b>.', flag:'The uploaded material does not name the auditing standard; reporting (Chapter 4) is not in the uploads. Confirm the standard reference with your lecturer.'},
{set:'L6-C1', n:'12', type:'short', q:'based on the findings , determine the appropriate audit plan?', ans:'<b>Client (2)</b> (DR 12%): more effective substantive procedures, larger samples, testing near year end, lower allocated (performance) materiality, and — with CR at 50% — limited reliance on controls. <b>Client (1)</b> (DR 20%, CR ≈ 43%): less extensive substantive work; some testing may be done at interim; higher allocated materiality; more reliance on controls.', flag:'The table’s "Audit approach ??" row is not defined in the notes. The answer applies the lecture’s planning table and "rely on ICS according to control-risk level".'},

/* ---- Lecture 6 Case 7 (no key) ---- */
{set:'L6-C7', n:'1', type:'short', q:'Calculate DR for each audit area.', ans:steps({g:'Cash 40%/30%/5%; Inventory 80%/70%/5%; Revenue 90%/60%/2%', f:'DR = AR ÷ (IR × CR)', c:'Cash 0.05 ÷ 0.12 = 0.4167; Inventory 0.05 ÷ 0.56 = 0.0893; Revenue 0.02 ÷ 0.54 = 0.0370', a:'<b>Cash 41.67%; Inventory 8.93%; Revenue 3.70%</b> (agrees with the DR column in the table)'})},
{set:'L6-C7', n:'2', type:'short', q:'Rank the areas according to required detection risk, from lowest to highest.', ans:'Revenue (3.70%) → Inventory (8.93%) → Cash (41.67%).'},
{set:'L6-C7', n:'3', type:'short', q:'Identify the area requiring the most effective substantive audit procedures.', ans:'<b>Revenue</b> — the lowest DR, driven by high IR (90%), CR 60% and a strict AR of 2%.'},

/* ---- Lecture 6 Case 8 (no key) ---- */
{set:'L6-C8', n:'1', type:'short', q:'Calculate DR for each area before revision.', ans:steps({g:'AR 4%; Inventory 90%/80%; Revenue 70%/60%; A/R 60%/40%', f:'DR = AR ÷ (IR × CR)', c:'Inventory 0.04 ÷ 0.72 = 0.0556; Revenue 0.04 ÷ 0.42 = 0.0952; A/R 0.04 ÷ 0.24 = 0.1667', a:'<b>Inventory 5.56%; Revenue 9.52%; Accounts receivable 16.67%</b>'})},
{set:'L6-C8', n:'2', type:'short', q:'Recalculate revenue DR after the revision.', ans:steps({g:'IR 70%, revised CR 30%, AR 4%', f:'DR = AR ÷ (IR × CR)', c:'0.04 ÷ 0.21 = 0.1905', a:'<b>19.05%</b>'})},
{set:'L6-C8', n:'3', type:'short', q:'Explain why the revised CR changes acceptable DR.', ans:'Tested automated controls lower CR, which lowers RMM (0.42 → 0.21). With AR fixed, DR = AR ÷ RMM rises (9.52% → 19.05%): the auditor can rely more on controls and perform less extensive or less costly substantive tests. RMM and DR are inversely related.'},
{set:'L6-C8', n:'4', type:'short', q:'Identify the area requiring the most effective substantive procedures.', ans:'<b>Inventory</b> — DR 5.56%, the lowest.'},
{set:'L6-C8', n:'5', type:'short', q:'If DR cannot be reduced to the calculated level for inventory, what should the auditor consider regarding the audit approach?', ans:'Audit risk would exceed 4%, so the auditor must change the approach: rely on substantive procedures rather than controls (CR is 80%), make the procedures more effective (nature), test near year end (timing), enlarge samples (extent) and lower performance materiality. If DR still cannot be brought down, the engagement letter warns that the opinion may have to be modified or the auditor may withdraw.', flag:'Opinion modification is covered in Chapter 4 (not uploaded); the withdrawal and modification wording comes from the engagement letter.'},

AD.RULES = [
{ id:'RU1', title:'Set, assess, plan', text:'The auditor <b>sets</b> acceptable audit risk, <b>assesses</b> inherent and control risk, and <b>plans</b> detection risk as the balancing figure. He does not choose RMM.', src:'lec_4__5.pdf p. 4', lec:'lecture/L45/L45S7', rev:['R-MC6','R-MC8','R-TF10'] },
{ id:'RU2', title:'RMM and DR move in opposite directions', text:'With AR fixed, higher IR or CR (higher RMM) means lower planned DR, and lower RMM allows higher DR.', src:'lec_4__5.pdf p. 7; lec6.pdf p. 5', lec:'lecture/L45/L45S6', rev:['R-TF7','R-TF9','R-C1-7','R-C3-2','R-C5-6'] },
{ id:'RU3', title:'Detection risk drives the plan', text:'Lower DR → more effective evidence (nature), more evidence (extent), testing near year end (timing), lower allocated materiality. Higher DR → the reverse, including interim testing.', src:'lec_4__5.pdf pp. 1, 4', lec:'lecture/L45/L45S5', rev:['R-MC7','R-C1-7','R-C3-2','R-C4-6'] },
{ id:'RU4', title:'Acceptable audit risk and evidence are inversely related', text:'The lower the AR the auditor accepts, the more evidence he needs (Table 9-3).', src:'lec_4__5.pdf p. 5', lec:'lecture/L45/L45S8', rev:['R-TF8','R-TF10'] },
{ id:'RU5', title:'No risk component can be zero', text:'AR cannot be zero (no absolute assurance); IR and CR cannot be zero; DR cannot be zero because of sampling risk (bad sample) and non-sampling risk (wrong evidence or test).', src:'lec_4__5.pdf p. 4', lec:'lecture/L45/L45S7', rev:['R-C4-6'] },
{ id:'RU6', title:'Materiality decision', text:'Misstatement found &gt; material misstatement limit → material; the lecture example then issues a qualified opinion. Misstatement ≤ limit → not material on its own.', src:'lec_4__5.pdf p. 8', lec:'lecture/L45/L45S10', rev:['R-C1-10','R-C1-12'] },
{ id:'RU7', title:'Lowest DR gets the strongest procedures', text:'Across several accounts or areas, the one with the lowest planned DR needs the most effective and most extensive substantive procedures.', src:'lec6.pdf p. 7', lec:'lecture/L6/L6S6', rev:['R-C1-7','R-C3-2','R-C5-5'] },
{ id:'RU8', title:'Choose the cheapest plan that meets AR', text:'Any DR at or below the maximum permissible DR satisfies the target; going far below it is over-auditing at extra cost.', src:'lec6.pdf p. 8', lec:'lecture/L6/L6S7', rev:['R-C4-2','R-C4-5','R-C5-3'] },
{ id:'RU9', title:'Audit vs review', text:'Audit → reasonable assurance, positive form ("In our opinion"), opinion, more evidence and fees. Review → limited assurance, negative form ("It has not come to our attention"), conclusion; obligatory for interim statements of public companies.', src:'lecture_one.pdf p. 10; lecture_two.pdf p. 9', lec:'lecture/L1/L1S9', rev:['R-TF1','R-TF6','R-MC1','R-MC4','R-T5','R-T6'] },
{ id:'RU10', title:'The services hierarchy', text:'Attestation ⊂ assurance. Other assurance = assurance without a formal report on another party’s assertion. Non-assurance = recommendations, two parties, independence not required.', src:'lecture_one.pdf pp. 8–13', lec:'lecture/L1/L1S7', rev:['R-T1','R-T2','R-T3','R-T4','R-MC3'] },
{ id:'RU11', title:'Identify the audit type by its criteria', text:'GAAP/IFRS → financial statement audit. Company efficiency standards → operational. Rules of a higher authority → compliance (reported to management). Fraud and corruption → forensic.', src:'lecture_two.pdf pp. 15–16', lec:'lecture/L2/L2S6', rev:['R-TF2','R-TF3','R-MC2','R-T7','R-T8','R-T9','R-T10','R-T15','R-T16'] },
{ id:'RU12', title:'Who focuses on what', text:'External auditors → fairness of financial statements (financial audit only). Internal auditors → efficiency and effectiveness of the employer (financial, operational, compliance). Governmental auditors → compliance emphasis and growing operational work.', src:'lecture_two.pdf pp. 17–20', lec:'lecture/L2/L2S12', rev:['R-TF4','R-TF5','R-T17','R-T18','R-T19'] },
{ id:'RU13', title:'Criteria are not auditing standards', text:'The applicable financial reporting framework (EAS, IFRS, GAAP, related laws) judges the statements. GAAS govern the auditor’s work.', src:'lecture_three.pdf p. 3', lec:'lecture/L3/L3S3', rev:['R-T11','R-T12','R-T13'] },
{ id:'RU14', title:'Assurance level is 1 − AR', text:'Overall assurance is the complement of audit risk, not of detection risk.', src:'lec7 key; lec6.pdf p. 6', lec:'lecture/L6/L6S6', rev:['R-TF11'] },
{ id:'RU15', title:'Reasonable, not absolute, assurance', text:'Four reasons: sampling, complex estimates, fraud and collusion are hard to detect, and the cost of 100% certainty is not economical. The opinion covers the statements as a whole.', src:'lecture_three.pdf pp. 3–4', lec:'lecture/L3/L3S5', rev:[] },

const metric = (label, a, b) => `<div class="metric"><span>${label}</span><b>${a} / ${b}</b><div class="bar"><i style="width:${pct(a,b)}%"></i></div></div>`;

function routeName(r){
  const [p,a,b] = r.split('/');
  if (p === 'lecture' && LEC[a]) return LEC[a].short + (b && SECBY[b] ? ' — ' + SECBY[b].title : '');
  if (p === 'search') return 'Search';
  const n = NAV.find(x => x[0] === p); return n ? n[1] : 'Control center';
}

/* ---------- LECTURE ---------- */

/* ---------- REVISION ---------- */
let revFilter = 'all';
function solHtml(r){
  let h = '';
  if (r.type === 'tf') h += `<div class="ans">${r.key ? 'True' : 'False'}${r.corr ? `<small>Corrected statement</small><span style="font-family:var(--fb);font-size:15.5px">${r.corr}</span>` : ''}</div>`;
  else if (r.type === 'mcq') { const o = r.opts.find(x => x[0] === r.key); h += `<div class="ans">(${r.key}) ${esc(o[1])}</div>`; }
  else h += `<div class="ans">${r.ans}</div>`;
  if (r.calc) h += `<h4>Step-by-step calculation</h4>${r.calc}`;
  if (r.expl) h += `<h4>Explanation</h4><div class="body-text">${/^</.test(r.expl) ? r.expl : `<p>${r.expl}</p>`}</div>`;
  if (r.others) h += `<h4>Why the other choices are wrong</h4><p>${r.others}</p>`;
  if (r.principle) h += `<div class="co rule"><b>Principle</b><p>${r.principle}</p></div>`;
  if (r.trap) h += `<div class="co trap"><b>${r.flag ? 'Flag — read before answering' : 'Common confusion'}</b><p>${r.trap}</p></div>`;
  const forms = (r.formulas||[]).map(f => `<a class="chip" href="#formulas/${f}">${esc(FORM[f].eq)}</a>`).join('');
  const cons = (r.topics||[]).map(t => `<a class="chip" href="#concepts/${t}">${esc(CON[t].name)}</a>`).join('');
  h += `<dl class="kv">${forms ? `<dt>Formula used</dt><dd><div class="btns">${forms}</div></dd>` : ''}<dt>Concepts</dt><dd><div class="btns">${cons}</div></dd><dt>Study the lecture</dt><dd>${lecLink(r.lec)}</dd><dt>Source</dt><dd>${srcTag(r.src)}</dd></dl>`;
  return h;
}
function revCard(r, opts){
  opts = opts || {};
  const showKey = opts.keyHi;
  const optsH = r.opts ? `<ul class="qopts">${r.opts.map(o => `<li class="${showKey && o[0]===r.key?'key':''}"><span class="l">${esc(o[0])}.</span><span>${esc(o[1])}</span></li>`).join('')}</ul>` : '';
  return `<article class="qcard" id="${r.id}"><div class="qhead"><span class="qnum">${esc(qLabel(r))}</span>${r.flag ? '<span class="badge warn">Needs your attention</span>' : ''}${st.revSeen[r.id] ? '<span class="badge ok">Studied</span>' : ''}<span style="margin-left:auto" class="no-print">${bmBtn(r.id, 'Revision '+qLabel(r), 'revision/'+r.id)}</span></div>
  <p class="qtext">${esc(r.q)}</p>${optsH}
  <details class="sol" data-rev="${r.id}" ${opts.open?'open':''}><summary>Show the solution</summary>${solHtml(r)}</details></article>`;
}
function pageRevision(anchor){
  const groups = AD.REV_META.groups;
  const f = revFilter;
  let html = '', lastCase = '';
  groups.forEach(g => {
    if (f !== 'all' && f !== g.g) return;
    html += `<h2 class="grp-h" id="grp-${g.g}">${esc(g.title)} <span class="tag" style="vertical-align:middle">${esc(g.src)}</span></h2>`;
    REV.filter(r => r.grp === g.g).forEach(r => {
      if (r.cs && r.cs !== lastCase){ lastCase = r.cs; const c = AD.RCASES[r.cs]; html += `<div class="casebox" id="${r.cs}"><h3>${esc(c.title)}</h3>${c.html}${srcTag(c.src)}</div>`; }
      html += revCard(r, {open: anchor === r.id});
    });
  });
  const cnt = g => REV.filter(r => r.grp === g).length;
  return `<div class="wrap"><header class="page-h"><h1 tabindex="-1">Revision solutions</h1><p class="lead">${esc(AD.REV_META.title)}: every question in its original wording and order, with a full model answer. Opening a solution marks it as studied.</p></header>
  <div class="filters no-print" role="group" aria-label="Filter questions">${[['all','All ('+REV.length+')'],['tf','True/False ('+cnt('tf')+')'],['mcq','Multiple choice ('+cnt('mcq')+')'],['term','Scientific terms ('+cnt('term')+')'],['case','Practical cases ('+cnt('case')+')']].map(x => `<button type="button" class="chip" data-act="revf" data-f="${x[0]}" aria-pressed="${f===x[0]}">${x[1]}</button>`).join('')}
  <span style="flex:1"></span><button type="button" class="btn ghost sm" data-act="expand" data-v="1">Expand all</button><button type="button" class="btn ghost sm" data-act="expand" data-v="0">Collapse all</button><button type="button" class="btn ghost sm" data-act="print">${ico('print')}<span>Print</span></button></div>
  <div class="co note no-print"><b>About the answer key</b><p>The file title says "without answers", but it includes keys for the theoretical sections (p. 1, 3, 4). Those keys are followed here and two discrepancies are flagged. The practical cases have no key; their solutions are computed step by step.</p></div>
  <div class="read" style="max-width:none">${html}</div></div>`;
}

/* ---------- PRACTICE ---------- */
let practiceLec = 'all';
function pageParam(a){ practiceLec = (a && LEC[a]) ? a : 'all'; return pagePractice(); }
function pagePractice(){
  const sets = AD.PSETS.filter(s => practiceLec === 'all' || s.lec === practiceLec);
  const body = sets.map(s => {
    const items = AD.PRACTICE.filter(p => p.set === s.id);
    const cs = s.cs ? AD.PCASES[s.cs] : null;
    return `<section class="panel" id="set-${s.id}" style="margin-bottom:18px"><div class="btns" style="justify-content:space-between"><h2 style="font-size:21px;margin:0">${esc(s.title)}</h2>${s.key==='given' ? '<span class="badge ok">Answer key in the source file</span>' : '<span class="badge warn">No key in the source — solved from the lecture content</span>'}</div><p style="margin-top:8px">${srcTag(s.src)}</p>
    ${cs ? `<div class="casebox" style="margin-top:8px">${cs.html}</div>` : ''}
    ${items.map(p => practiceItem(p)).join('')}</section>`;
  }).join('');
  return `<div class="wrap"><header class="page-h"><h1 tabindex="-1">Practice bank</h1><p class="lead">Every question set printed inside the lecture files (${AD.PRACTICE.length} items). Choose an answer to check it instantly; written questions have a model answer to compare with.</p></header>
  <div class="filters no-print" role="group" aria-label="Filter by lecture"><button type="button" class="chip" data-act="pf" data-f="all" aria-pressed="${practiceLec==='all'}">All lectures</button>${AD.LECTURES.map(l => `<button type="button" class="chip" data-act="pf" data-f="${l.id}" aria-pressed="${practiceLec===l.id}">${esc(l.short)}</button>`).join('')}</div>${body}</div>`;
}
function practiceItem(p){
  const prev = st.pans[p.id];
  let resp = '';
  if (p.type === 'tf' || p.type === 'mcq'){
    const opts = p.type === 'tf' ? [['a','True'],['b','False']] : p.o;
    const keyIdx = p.type === 'tf' ? (p.a ? 0 : 1) : p.a;
    resp = `<div class="opts" style="display:grid;gap:6px">${opts.map((o,j) => {
      let cls = ''; if (prev != null){ if (j === keyIdx) cls = 'right'; else if (j === prev) cls = 'wrong'; }
      return `<button type="button" class="optbtn ${cls}" data-act="pans" data-id="${p.id}" data-i="${j}" data-k="${keyIdx}"><span class="l">${esc(o[0])}</span><span>${esc(o[1])}</span></button>`; }).join('')}</div>
      <div class="fbx" aria-live="polite">${prev != null ? practiceFb(p, prev === keyIdx) : ''}</div>`;
  } else {
    resp = `<details class="sol"><summary>Show the model answer</summary><div class="body-text">${/^</.test(p.ans) ? p.ans : `<p>${p.ans}</p>`}</div>${p.flag ? `<div class="co trap"><b>Flag</b><p>${esc(p.flag)}</p></div>` : ''}</details>`;
  }
  return `<div class="qcard" id="${p.id}" style="background:var(--s2)"><div class="qhead"><span class="qnum">${esc(p.n)}</span></div><p class="qtext">${esc(p.q)}</p>${resp}</div>`;
}
function practiceFb(p, ok){
  return `<div class="fb ${ok?'ok':'no'}"><b>${ok ? 'Correct.' : 'Not quite.'}</b> ${esc(p.why||'')}${p.flag ? `<div class="co trap" style="margin:8px 0 0"><b>Flag</b><p>${esc(p.flag)}</p></div>` : ''}</div>`;
}

/* ---------- FORMULAS & RULES ---------- */

  return `<div class="wrap"><header class="page-h"><h1 tabindex="-1">Audit rules &amp; formula library</h1><p class="lead">Every equation and quantitative relationship in the lectures, followed by the non-mathematical decision rules. Rules are never dressed up as formulas.</p></header>
  <div class="filters no-print"><button type="button" class="chip" data-act="ff" data-f="all" aria-pressed="${formFilter==='all'}">All</button><button type="button" class="chip" data-act="ff" data-f="rev" aria-pressed="${formFilter==='rev'}">USED IN REVISION</button>
   <div class="search" style="max-width:320px;flex:1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${IP.search}"/></svg><input type="text" data-formq placeholder="Filter formulas and rules" value="${esc(formQ)}" aria-label="Filter formulas and rules"></div>
   <button type="button" class="btn ghost sm" data-act="print">${ico('print')}<span>Print</span></button></div>
  <h2 class="grp-h">Formulas (${fs.length})</h2>
  ${fs.map(f => `<article class="fcard" id="${f.id}"><div class="btns" style="justify-content:space-between"><h3 style="margin:0">${esc(f.title)}</h3><div class="btns">${f.flag ? '<span class="badge warn">Implied — verify</span>' : ''}${used(f) ? '<span class="badge o">Used in revision</span>' : ''}</div></div>
   <div class="eq">${esc(f.eq)}</div>
   <dl><dt>Variables</dt><dd>${f.vars.map(v => `<b style="color:var(--w)">${esc(v[0])}</b> — ${esc(v[1])}`).join('<br>')}</dd><dt>Assumptions</dt><dd>${f.assume}</dd><dt>When to apply</dt><dd>${f.when}</dd><dt>Worked example</dt><dd>${f.ex}</dd><dt>Common errors</dt><dd>${f.errors}</dd><dt>Lecture</dt><dd>${lecLink(f.lec)} ${srcTag(f.src)}</dd><dt>Revision questions</dt><dd><div class="btns">${revChips(f.rev)}</div></dd></dl>
   <div class="btns no-print">${copyBtn(f.eq,'Copy formula')}${bmBtn(f.id, 'Formula: '+f.title, 'formulas/'+f.id)}</div></article>`).join('') || '<p class="empty">No formula matches this filter.</p>'}
  <h2 class="grp-h">Audit rules &amp; principles (${rs.length})</h2>
  <div class="grid2">${rs.map(r => `<article class="fcard" id="${r.id}" style="margin:0"><h3>${esc(r.title)}</h3><p>${r.text}</p><p style="font-size:14px">${lecLink(r.lec)} ${srcTag(r.src)}</p><div class="btns" style="margin-bottom:10px">${revChips(r.rev)}</div><div class="btns no-print">${copyBtn(strip(r.text),'Copy rule')}${bmBtn(r.id,'Rule: '+r.title,'formulas/'+r.id)}</div></article>`).join('') || '<p class="empty">No rule matches this filter.</p>'}</div></div>`;
}

/* ---------- CONCEPT SHEET ---------- */
let sheetMode = 'master';
function pageConcepts(anchor){
  if (anchor && CON[anchor]) sheetMode = 'master';
  const cats = AD.CONCEPT_CATS;
  let body;

  const nodes = N.map(n => { const w = Math.max(120, n[3].length*7.6+24); const big = n[0]==='extaudit'; return `<g class="mn ${mapSel===n[0]?'sel':''} ${nb.has(n[0])?'nb':''}" data-act="mapn" data-id="${n[0]}" tabindex="0" role="button" aria-pressed="${mapSel===n[0]}" aria-label="${esc(n[3])}"><rect x="${n[1]-w/2}" y="${n[2]-(big?22:18)}" width="${w}" height="${big?44:36}" rx="${big?22:18}"/><text x="${n[1]}" y="${n[2]+4.5}" text-anchor="middle" ${big?'style="font-size:15px;font-weight:700"':''}>${esc(n[3])}</text></g>`; }).join('');
  const c = mapSel ? CON[mapSel] : null;

   <p style="margin-top:12px"><a href="#concepts/${c.id}">Open in the concept sheet</a></p>`
   : `<h2 style="font-size:22px">Select a concept</h2><p class="muted">Click or press Enter on any node to see its definition, the lecture that teaches it, its connections and the revision questions that test it.</p>`;

}

/* ---------- CASE LAB ---------- */
let sim = {A:{ar:5,ir:40,cr:60}, B:{ar:5,ir:40,cr:40}}; let t93 = null;
const T93 = [['1','High','Low','Low','High','Low','A high acceptable risk (large numerator) with low client risk (small denominator) gives the highest DR and the least evidence.'],['2','Low','Low','Low','Medium','Medium','Low AR pulls DR down while low IR and CR push it up — the effects offset to medium. This is the row behind Revision T/F 7.'],['3','Low','High','High','Low','High','Worst case: low tolerance and high client risk — lowest DR, most evidence.'],['4','Medium','Medium','Medium','Medium','Medium','Everything medium gives medium.'],['5','High','Low','Medium','Medium','Medium','High AR and low IR push DR up; medium CR pulls it back to medium.']];
function simCalc(s){ const rmm = s.ir/100*s.cr/100; const dr = (s.ar/100)/rmm; return {rmm, dr, as:1-s.ar/100}; }
function simOut(){
  const a = simCalc(sim.A), b = simCalc(sim.B);
  const cmp = Math.abs(a.dr-b.dr) < 1e-9 ? 'Both scenarios need the same planned detection risk, so the same substantive response.' :
    `Scenario ${a.dr<b.dr?'A':'B'} has the lower planned DR, so it needs <b>more effective</b> procedures, <b>more</b> evidence (larger samples), testing <b>near year end</b> and a <b>lower</b> allocated materiality than Scenario ${a.dr<b.dr?'B':'A'}.`;
  const cap = x => x.dr >= 1 ? ' <span class="badge warn">AR ≥ RMM: the model gives DR ≥ 100%</span>' : '';
  return `<div class="grid2" style="margin-top:12px"><div class="panel"><b>Scenario A</b><div class="simout">DR = ${fmtP(Math.min(a.dr,9.99))}${cap(a)}</div><div class="muted" style="font-size:14px">RMM = ${fmtP(a.rmm)}; assurance = ${fmtP(a.as)}</div></div><div class="panel"><b>Scenario B</b><div class="simout">DR = ${fmtP(Math.min(b.dr,9.99))}${cap(b)}</div><div class="muted" style="font-size:14px">RMM = ${fmtP(b.rmm)}; assurance = ${fmtP(b.as)}</div></div></div><p style="margin-top:12px">${cmp}</p>`;
}
const rng = (sc, k, label, min, max) => `<div class="rng"><label for="r-${sc}-${k}">${label}</label><input type="range" id="r-${sc}-${k}" min="${min}" max="${max}" step="1" value="${sim[sc][k]}" data-sim="${sc}" data-k="${k}"><output id="o-${sc}-${k}">${sim[sc][k]}%</output></div>`;
function pageLab(){
  return `<div class="wrap"><header class="page-h"><h1 tabindex="-1">Audit case lab</h1><p class="lead">Practise the reasoning behind the risk model and the acceptance phase. Every scenario here is supplementary practice written for this platform; the original exam cases are in Revision solutions.</p></header>
  <section class="panel"><h2 style="font-size:22px">Audit-risk simulator</h2><p class="muted">Uses only the lecture model: DR = AR ÷ (IR × CR). Compare two settings — as in Lecture 4&amp;5 Example 1, where only CR changes — and see which needs the stronger substantive response.</p>
   <div class="sim">${['A','B'].map(sc => `<fieldset><legend>Scenario ${sc}</legend>${rng(sc,'ar','AR',1,20)}${rng(sc,'ir','IR',5,100)}${rng(sc,'cr','CR',5,100)}</fieldset>`).join('')}</div><div id="simout" aria-live="polite">${simOut()}</div></section>
  <section class="panel"><h2 style="font-size:22px">Table 9-3 explorer</h2><p class="muted">Select a situation to see why the planned detection risk and evidence come out as they do (lec_4__5.pdf p. 5).</p>
   <div class="tbl"><table class="t93"><thead><tr><th>Situation</th><th>Acceptable AR</th><th>IR</th><th>CR</th><th>Planned DR</th><th>Evidence</th></tr></thead><tbody>${T93.map((r,i) => `<tr data-act="t93" data-i="${i}" tabindex="0" class="${t93===i?'on':''}">${r.slice(0,6).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
   <div aria-live="polite">${t93!=null ? `<div class="co rule"><b>Situation ${T93[t93][0]}</b><p>${T93[t93][6]}</p></div>` : ''}</div></section>
  <h2 class="grp-h">Decision scenarios <span class="badge warn" style="vertical-align:middle">Supplementary practice</span></h2>
  ${AD.LAB.map(scnHtml).join('')}</div>`;
}
function scnHtml(s){
  const p = st.lab[s.id] || {step:0, picks:{}};
  const steps = s.steps.slice(0, p.step+1).map((q,k) => {
    const pick = p.picks[k];
    return `<div class="stepq"><b style="color:var(--w)">Step ${k+1}. ${esc(q.q)}</b><div style="display:grid;gap:6px;margin-top:8px">${q.o.map((o,j) => `<button type="button" class="optbtn ${pick===j?(o[1]?'right':'wrong'):''}" data-act="lab" data-s="${s.id}" data-k="${k}" data-j="${j}" ${p.step>k?'disabled':''}><span class="l">${'abc'[j]}</span><span>${esc(o[0])}</span></button>`).join('')}</div>${pick!=null ? `<div class="fb ${q.o[pick][1]?'ok':'no'}">${q.o[pick][2]}</div>` : ''}</div>`;

}

/* ---------- FLASHCARDS ---------- */
let fcFilter = 'all', fcQueue = [], fcIdx = 0, fcFlip = false;
function buildQueue(){
  let cards = FLASH.filter(c => fcFilter === 'all' || (fcFilter === 'review' ? (st.fc[c.id]||{}).s === 'r' : c.lec === fcFilter));
  const rank = c => { const s = st.fc[c.id]; if (!s) return 1; if (s.s === 'r') return 0; return 2; };
  cards.sort((a,b) => rank(a)-rank(b) || ((st.fc[a.id]||{}).t||0) - ((st.fc[b.id]||{}).t||0));
  fcQueue = cards.map(c => c.id); fcIdx = 0; fcFlip = false;
}
function pageFlash(){
  if (!fcQueue.length) buildQueue();
  const FB = {}; FLASH.forEach(c => FB[c.id] = c);
  const pool = FLASH.filter(c => fcFilter === 'all' || (fcFilter === 'review' ? (st.fc[c.id]||{}).s === 'r' : c.lec === fcFilter));
  const known = pool.filter(c => (st.fc[c.id]||{}).s === 'k').length, rev = pool.filter(c => (st.fc[c.id]||{}).s === 'r').length;
  const card = FB[fcQueue[fcIdx]];
  const sel = `<select id="fcf" aria-label="Filter flashcards" style="max-width:260px"><option value="all" ${fcFilter==='all'?'selected':''}>All lectures (${FLASH.length})</option>${AD.LECTURES.map(l => `<option value="${l.id}" ${fcFilter===l.id?'selected':''}>${esc(l.short)} (${FLASH.filter(c=>c.lec===l.id).length})</option>`).join('')}<option value="review" ${fcFilter==='review'?'selected':''}>Marked "Review again" (${FLASH.filter(c=>(st.fc[c.id]||{}).s==='r').length})</option></select>`;
  return `<div class="wrap"><header class="page-h"><h1 tabindex="-1">Flashcards</h1><p class="lead">Active recall from the lectures. Cards you mark "Review again" come back first; known cards move to the end of the queue.</p></header>
  <div class="filters">${sel}<span class="badge ok">${known} known</span><span class="badge warn">${rev} to review</span><span class="badge">${pool.length - known - rev} new</span></div>
  ${card ? `<div class="fcwrap"><div class="fc ${fcFlip?'flip':''}" data-act="fcflip" role="button" tabindex="0" aria-label="Flashcard. Press Space or Enter to flip."><div class="face front" aria-hidden="${fcFlip}"><small>${esc(LEC[card.lec] ? LEC[card.lec].short : '')} — card ${fcIdx+1} of ${fcQueue.length}</small><p>${esc(card.f)}</p></div><div class="face back" aria-hidden="${!fcFlip}"><small>Answer</small><p>${esc(card.b)}</p></div></div>
  <div class="fcctl"><button type="button" class="btn ghost" data-act="fcnav" data-d="-1" ${fcIdx===0?'disabled':''}>Previous</button><button type="button" class="btn ghost" data-act="fcflip">${fcFlip?'Show question':'Reveal answer'}</button><button type="button" class="btn ghost" data-act="fcmark" data-v="r">Review again</button><button type="button" class="btn" data-act="fcmark" data-v="k">Know it</button><button type="button" class="btn ghost" data-act="fcnav" data-d="1" ${fcIdx>=fcQueue.length-1?'disabled':''}>Next</button></div>
  <p class="muted" style="text-align:center;font-size:13px;margin-top:12px">Keyboard: Space to flip, K know it, R review again, arrow keys to move.</p></div>`
  : `<p class="empty"><b>No cards in this view.</b> ${fcFilter==='review' ? 'You have not marked any card "Review again" yet.' : ''} Choose another filter.</p>`}</div>`;
}

  return `<div class="wrap"><header class="page-h"><h1 tabindex="-1">My weak points</h1><p class="lead">Built only from what you have done on this device.</p></header>

   <section class="panel"><h2 style="font-size:22px">Concepts you missed most</h2>${topics.length ? `<div class="tbl"><table><thead><tr><th>Concept</th><th>Missed</th><th>Study</th></tr></thead><tbody>${topics.map(t => `<tr><td>${esc(CON[t].name)}</td><td>${topic[t].n}</td><td>${lecLink(CON[t].lec)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No missed exam questions recorded.</p>'}</section>

  const pc = {}; AD.PSETS.forEach(s => pc[s.id] = AD.PRACTICE.filter(p => p.set === s.id).length);
  const cnt = g => REV.filter(r => r.grp === g).length;
